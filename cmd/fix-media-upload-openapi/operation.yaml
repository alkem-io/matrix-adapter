operationId: MediaUploadHandler.handleUpload
summary: Upload a original attachment stream to Synapse without publishing an event.
description: |
  Internal network-only endpoint for the trusted Alkemio server. The request body
  is original bytes, never JSON or multipart. Content-Type is required and
  must contain the original MIME type. Content-Length is exact and required,
  including for a zero-byte file. The stream is not retried. Success is 201 only
  after the synchronous Synapse media provider has stored the upload.
parameters:
  - in: header
    name: X-Alkemio-Actor-ID
    required: true
    description: Non-nil Alkemio actor UUID; the upload uses this sender's identity.
    schema:
      type: string
      format: uuid
  - in: header
    name: X-Alkemio-Display-Name
    required: true
    description: Nonempty UTF-8 filename, percent-encoded exactly once; controls are rejected.
    schema:
      type: string
  - in: header
    name: Content-Length
    required: true
    description: Exact number of original bytes, including zero; bounded by MaxAttachmentBytes.
    schema:
      type: integer
      format: int64
      minimum: 0
requestBody:
  required: true
  description: Raw original bytes; Content-Type declares their MIME type.
  content:
    '*/*':
      schema:
        type: string
        format: binary
responses:
  "201":
    description: Synapse upload completed, without publishing a message event.
    content:
      application/json:
        schema:
          type: object
          required: [contentUri, mediaId]
          properties:
            contentUri:
              type: string
              description: Local homeserver mxc URI of the completed upload.
            mediaId:
              type: string
              description: Media identifier embedded in contentUri.
  "400":
    description: Invalid request metadata or media.
    content:
      application/json:
        schema:
          type: object
          required: [error]
          properties:
            error:
              type: string
              enum: [invalid_actor, invalid_display_name, invalid_content_type, invalid_media]
  "408":
    description: Upload was canceled.
    content:
      application/json:
        schema:
          type: object
          required: [error]
          properties:
            error:
              type: string
              enum: [upload_canceled]
  "411":
    description: Content-Length is required.
    content:
      application/json:
        schema:
          type: object
          required: [error]
          properties:
            error:
              type: string
              enum: [length_required]
  "413":
    description: Media exceeds the upload byte limit.
    content:
      application/json:
        schema:
          type: object
          required: [error]
          properties:
            error:
              type: string
              enum: [media_too_large]
  "502":
    description: Synapse rejected the upload or its upload request failed.
    content:
      application/json:
        schema:
          type: object
          required: [error]
          properties:
            error:
              type: string
              enum: [upstream_rejected, upstream_upload_failed]
  "504":
    description: Upload timed out.
    content:
      application/json:
        schema:
          type: object
          required: [error]
          properties:
            error:
              type: string
              enum: [upload_timeout]
