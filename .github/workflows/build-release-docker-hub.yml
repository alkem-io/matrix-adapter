name: Deploy to DockerHub

on:
  release:
    # `released` additionally covers a pre-release later promoted to a full
    # release (promotion fires no `published` event). A normal stable publish
    # fires BOTH types; the runs serialize via the concurrency group and are
    # idempotent.
    types: [published, released]

# Two releases published minutes apart must apply their floating tags
# (latest, vMAJOR, vMAJOR.MINOR) in publish order.
concurrency:
  group: dockerhub-release
  cancel-in-progress: false

jobs:
  release:
    uses: antst/alkemio-github-workflows/.github/workflows/container-release.yml@v1
    permissions:
      contents: read
      packages: write
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
