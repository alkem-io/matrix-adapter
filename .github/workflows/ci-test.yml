name: CI — Lint & Test

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ci:
    uses: alkem-io/github-workflows/.github/workflows/go-ci.yml@v1
    permissions:
      contents: read
    with:
      # Old `make lint` ran go vet before golangci-lint; keep that.
      run-vet: true
      # Staleness gate: make openapi regenerates openapi.yaml with the
      # centrally pinned apispec, then the diff must be clean.
      openapi-make-target: openapi

  # The Synapse media storage provider (synapse-modules/) is Python, so the Go
  # job above cannot gate it. Without this job its unit tests gate nothing —
  # which is how provider regressions have shipped before. The suite is hermetic
  # (no Synapse install, no reactor, no network) and runs in a couple of seconds.
  python-modules:
    name: Synapse modules (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: synapse-modules/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r synapse-modules/requirements-dev.txt

      - name: Run Synapse module tests
        run: make test-python

      # The downstream sync script is shell, so neither the Go job nor pytest
      # gates it — yet it edits deployment ConfigMaps in three other repos.
      - name: Run sync-script fixture tests
        run: make test-scripts
