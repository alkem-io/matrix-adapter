name: Build & Deploy Matrix Adapter to Dev on Hetzner

on:
  push:
    branches: [develop]

jobs:
  deploy:
    uses: alkem-io/github-workflows/.github/workflows/deploy-hetzner.yml@v1
    with:
      environment: dev
      # All names match the org conventions derived from the repo name:
      # alkemio-matrix-adapter / alkemio-matrix-adapter-deployment /
      # matrix-adapter-registry — no overrides needed.
    secrets:
      KUBECONFIG: ${{ secrets.KUBECONFIG_SECRET_HETZNER_DEV }}
      REGISTRY_LOGIN_SERVER: ${{ secrets.REGISTRY_LOGIN_SERVER }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
