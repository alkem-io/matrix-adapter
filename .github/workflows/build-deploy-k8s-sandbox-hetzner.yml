name: Build & Deploy Matrix Adapter to Sandbox on Hetzner

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: antst/alkemio-github-workflows/.github/workflows/deploy-hetzner.yml@v1
    with:
      environment: sandbox
      # Names match the org conventions derived from the repo name.
    secrets:
      KUBECONFIG: ${{ secrets.KUBECONFIG_SECRET_HETZNER_SANDBOX }}
      REGISTRY_LOGIN_SERVER: ${{ secrets.REGISTRY_LOGIN_SERVER }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
