name: Publish Shared Library

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'lib/**'
      - 'pkg/dto/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # Required for npmjs provenance
      id-token: write       # Required for npm provenance / trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: ${{ startsWith(github.ref, 'refs/tags/v') && 'https://registry.npmjs.org' || '' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Update npm
        run: npm install -g npm@11

      - name: Generate Library
        run: make generate

      - name: Install Dependencies
        working-directory: lib
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: lib
        run: pnpm build

      - name: Set Version (Tag - npmjs)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        working-directory: lib
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting version to ${VERSION} for npmjs"
          npm version "${VERSION}" --no-git-tag-version

      - name: Publish to npmjs (Tag)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        working-directory: lib
        run: pnpm publish --no-git-checks --tag latest --access public --provenance

      - name: Publish preview to pkg.pr.new (PR/Manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: pnpx pkg-pr-new publish './lib'
