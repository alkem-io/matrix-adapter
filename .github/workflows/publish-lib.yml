name: Publish Shared Library

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'lib/**'
      - 'pkg/dto/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # Required for npm provenance / trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Setup Node.js (GitHub Packages)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@alkem-io'

      - name: Setup Node.js (npmjs)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Update npm
        run: npm install -g npm@11

      - name: Generate Library
        run: make generate

      - name: Install Dependencies
        working-directory: lib
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: lib
        run: pnpm build

      - name: Set Version and Package Name (Tag - npmjs)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        working-directory: lib
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Setting version to $VERSION for npmjs"
          # Update package name for npmjs
          npm pkg set name="@alkemio/matrix-adapter-lib"
          npm version $VERSION --no-git-tag-version
          # Update publishConfig for npmjs
          npm pkg set publishConfig.registry="https://registry.npmjs.org/"

      - name: Set Version (PR)
        if: github.event_name == 'pull_request'
        working-directory: lib
        run: |
          PR_NUMBER=${{ github.event.number }}
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="0.0.0-pr-${PR_NUMBER}-${SHORT_SHA}"
          echo "Setting version to $VERSION"
          npm version $VERSION --no-git-tag-version

      - name: Set Version (Manual)
        if: github.event_name == 'workflow_dispatch'
        working-directory: lib
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="0.0.0-manual-${SHORT_SHA}"
          echo "Setting version to $VERSION"
          npm version $VERSION --no-git-tag-version

      - name: Publish to npmjs (Tag)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        working-directory: lib
        run: pnpm publish --no-git-checks --tag latest --access public --provenance

      - name: Publish to GitHub Packages (PR/Manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: lib
        run: pnpm publish --no-git-checks --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
