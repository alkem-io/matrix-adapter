version: 2

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gocyclo
    - misspell
    - unconvert
    - unparam
    - revive
    - gocritic
    - gosec
    - prealloc
    - whitespace

formatters:
  enable:
    - gofmt
    - goimports

linters-settings:
  gocyclo:
    min-complexity: 15
  goimports:
    local-prefixes: github.com/alkemio/matrix-adapter-go
  revive:
    enable-all-rules: false
    rules:
      - name: exported
      - name: package-comments
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id
      - name: defer
      - name: constant-logical-expr
      - name: bool-literal-in-expr
      - name: atomic

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
